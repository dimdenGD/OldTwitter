name: Test locales

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ] 

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        
      - name: Test locales
        run: npm run test
